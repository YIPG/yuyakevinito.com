# Generated by YIPG/health scripts/sync-check-runner.mjs
name: Production browser checks
on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'
  check_run:
    types: [completed]
permissions:
  contents: read
  checks: read
concurrency:
  group: production-browser-checks
  cancel-in-progress: false
jobs:
  check:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'check_run' ||
       (github.event.check_run.app.id == 85455 &&
        github.event.check_run.name == 'Workers Builds: yuyakevinito-com' &&
        github.event.check_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - name: Verify production deployment
        id: gate
        run: node site-checks/shared/report.mjs gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      - name: Install browsers and video encoder
        if: steps.gate.outputs.run == 'true'
        run: |
          npx playwright install --with-deps chromium webkit
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: node site-checks/shared/report.mjs prepare
        id: prepare
        if: steps.gate.outputs.run == 'true'
        env:
          EXPECTED_SITE_VERSION: ${{ steps.gate.outputs.expected-version }}
      - run: npx playwright test --config site-checks/shared/config.mjs
        if: steps.gate.outputs.run == 'true'
      - name: Encode captioned mobile recordings
        if: always() && steps.prepare.outcome == 'success'
        run: node site-checks/shared/recordings.mjs
      - name: Publish results and recordings
        if: always() && steps.gate.outputs.run == 'true'
        run: node site-checks/shared/report.mjs publish
        env:
          SITE_CHECKS_SECRET: ${{ secrets.SITE_CHECKS_SECRET }}
