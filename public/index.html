      content="Hi, I'm Yuya. A software engineer who enjoys building useful things and exploring new ideas. yuyakevinito.com"

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yuya | Software Engineer" />
    <meta
      name="twitter:description"
      content="A software engineer who enjoys building useful things and exploring new ideas."

    <meta
      name="twitter:image"
      content="https://yuyakevinito.com/social-card.png"

    <meta
      name="twitter:image:alt"
      content="Hi, I'm Yuya. A software engineer who enjoys building useful things and exploring new ideas. yuyakevinito.com"
    />
    <link rel="canonical" href="https://yuyakevinito.com/" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Yuya | Software Engineer</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #292b27;
        background: #f8f7f4;
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 3rem clamp(1.5rem, 7vw, 5rem);
        place-items: center;
      }

      main {
        width: 100%;
        max-width: 42rem;
      }

      .wave {
        display: block;
        width: fit-content;
        margin-bottom: 1.75rem;
        font-size: 2rem;
        line-height: 1;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 9vw, 5.5rem);
        font-weight: 650;
        letter-spacing: -0.065em;
        line-height: 1.12;
        text-wrap: balance;
      }

      .bio {
        max-width: 32rem;
        margin: 1.5rem 0 0;
        color: #54594f;
        font-size: clamp(1.125rem, 2.5vw, 1.375rem);
        line-height: 1.7;
        text-wrap: pretty;
      }

      .note {
        display: flex;
        align-items: baseline;
        gap: 0.65rem;
        margin: 2.5rem 0 0;
        color: #676c61;
        font-size: 0.875rem;
        line-height: 1.6;
      }

      .note::before {
        width: 0.4rem;
        height: 0.4rem;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #7c8867;
        content: "";
      }

      ::selection {
        color: #292b27;
        background: #dce4cf;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="wave" aria-hidden="true">&#x1f44b;</span>
      <h1>Hi, I'm Yuya.</h1>
      <p class="bio">
        I'm a software engineer who enjoys building useful things and exploring
        new ideas.
      </p>
      <p class="note">A few things are in the works. More soon.</p>
    </main>
  </body>
</html>
